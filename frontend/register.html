<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HCK LMS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-page">

        <div class="register-card">

            <h1>Create Account</h1>

            <p class="register-subtitle">
                Join the High Court of Kerala Learning Management System
            </p>

            <form>

                <div class="form-group">
                    <label>Full Name</label>
                    <input id="register-name" type="text" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input id="register-email" type="email" placeholder="example@gmail.com">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" placeholder="Enter department">
                </div>

                

                <div class="form-group">
                    <label>Password</label>
                    <input id="register-password" type="password" placeholder="Create password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input id="register-confirm-password" type="password" placeholder="Confirm password">
                </div>

                <p id="register-message" aria-live="polite"></p>

                <button id="register-button" type="submit" class="register-submit-btn">
                    Register
                </button>
                
            </form>
<div class="social-login-section">

    <div class="social-divider">
        <span>Or register with</span>
    </div>

    <button
    type="button"
    class="social-btn"
    onclick="
window.location.href =
window.location.hostname.includes('app.github.dev')
? window.location.origin.replace('-3000.','-5000.') + '/api/auth/google'
: 'http://localhost:5000/api/auth/google'
" 
        <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
            alt="Google">

        <span>Continue with Google</span>
    </button>

</div>
            <p class="login-link">

                Already have an account?

                <a href="index.html">Sign In</a>

            </p>

        </div>

    </div>
<script src="js/api.js"></script>
<script src="js/register.js"></script>
<script src="app.js"></script>
</body>

</html>
