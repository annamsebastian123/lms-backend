<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module Customizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo-container" style="padding: 10px 0 25px 0; display: flex; justify-content: flex-start; align-items: center;">
        <img src="assets/logo.svg" alt="High Court LMS Logo" style="height: 75px; width: auto; max-width: 220px; object-fit: contain; display: block;">
    </div>
    <ul>
        <li><a href="tutor-dashboard.html">Dashboard</a></li>
        <li><a href="my-courses.html" class="active">My Courses</a></li>
        <li><a href="create-course.html">Create Course</a></li>
        <li><a href="analytics.html">Analytics</a></li>
        <li><a href="tutor-profile.html">Profile</a></li>
    </ul>
    <div class="sidebar-logout">
        <a href="index.html" onclick="localStorage.clear()">Logout</a>
    </div>
</div>

<div class="main">
    <div class="top-header" style="margin-bottom: 20px;">
        <div>
            <a href="#" id="backToCourseBtn" style="text-decoration: none; color: #4f46e5; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;">
                ← Back to Course Customizer
            </a>
            <div style="display: flex; align-items: center; gap: 15px;">
                <input type="text" id="moduleTitleInput" style="font-size: 28px; font-weight: 700; color: #0f172a; border: 1px solid transparent; background: transparent; padding: 4px 8px; border-radius: 6px; flex: 1; min-width: 300px; margin-top: 0; margin-bottom: 0;" placeholder="Module Title">
                <button class="publish-btn" id="saveModuleTitleBtn" style="margin: 0; padding: 8px 16px; font-size: 14px;">Save Title</button>
            </div>
            <p style="margin-top: 6px; color: #64748b; font-size: 14px;" id="courseContextLabel">Loading course context...</p>
        </div>
    </div>

    <!-- Layout Grid: Lessons (Left) & Quizzes (Right) -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
        
        <!-- Left: Lesson Workspace -->
        <div class="profile-details" style="margin: 0;">
            <h2 style="font-size: 18px; color: #0f172a; border-bottom: 1.5px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px;">Lessons Management</h2>
            
            <!-- Add Lesson Panel -->
            <div id="addLessonPanel" style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <h3 style="font-size: 14px; color: #475569; margin-top: 0; margin-bottom: 15px; font-weight: 600;">+ Create New Lesson</h3>
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Lesson Title</label>
                    <input type="text" id="newLessonTitle" placeholder="e.g. Overview of filing process" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                </div>
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Duration (minutes)</label>
                    <input type="number" id="newLessonDuration" placeholder="e.g. 15" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Video Source</label>
                    <select id="newLessonVideoSource" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                        <option value="YOUTUBE">YouTube Link</option>
                        <option value="SELF_HOSTED">Self-Hosted Video (MinIO)</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 10px;" id="youtubeUrlGroup">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">YouTube URL</label>
                    <input type="text" id="newLessonVideoUrl" placeholder="https://www.youtube.com/watch?v=..." style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                </div>

                <div class="form-group" style="margin-bottom: 10px; display: none;" id="selfHostedGroup">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Upload Video (MP4)</label>
                    <input type="file" id="newLessonFile" accept="video/mp4" style="margin-top: 4px; margin-bottom: 4px; font-size: 13px;">
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Lesson Notes / Text Instructions</label>
                    <textarea id="newLessonContent" placeholder="Enter lesson notes, guidelines, or text references..." style="height: 100px; padding: 10px; font-size: 13px; border-radius: 8px; border: 1.5px solid #e2e8f0; margin-top: 4px; margin-bottom: 4px;"></textarea>
                </div>

                <button class="publish-btn" id="saveLessonBtn" style="margin: 0; width: 100%; padding: 10px; font-size: 13px;">Add Lesson</button>
            </div>

            <!-- Existing Lessons List -->
            <div id="lessonsListContainer" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Loaded dynamically -->
            </div>
        </div>

        <!-- Right: Quiz Workspace -->
        <div class="profile-details" style="margin: 0;">
            <h2 style="font-size: 18px; color: #0f172a; border-bottom: 1.5px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px;">Quiz Questions</h2>
            
            <!-- Add Quiz Question Panel -->
            <div id="addQuestionPanel" style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <h3 style="font-size: 14px; color: #475569; margin-top: 0; margin-bottom: 15px; font-weight: 600;">+ Create Quiz Question</h3>
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Question Text</label>
                    <input type="text" id="newQuestionText" placeholder="Enter quiz question" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group">
                        <label style="font-size: 11px; font-weight: 600; color: #475569;">Option 1</label>
                        <input type="text" id="newOption1" placeholder="Option 1" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                    </div>
                    <div class="form-group">
                        <label style="font-size: 11px; font-weight: 600; color: #475569;">Option 2</label>
                        <input type="text" id="newOption2" placeholder="Option 2" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                    </div>
                    <div class="form-group">
                        <label style="font-size: 11px; font-weight: 600; color: #475569;">Option 3</label>
                        <input type="text" id="newOption3" placeholder="Option 3" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                    </div>
                    <div class="form-group">
                        <label style="font-size: 11px; font-weight: 600; color: #475569;">Option 4</label>
                        <input type="text" id="newOption4" placeholder="Option 4" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">Correct Option</label>
                    <select id="newQuestionCorrect" style="padding: 8px 12px; font-size: 13px; margin-top: 4px; margin-bottom: 4px;">
                        <option value="1">Option 1</option>
                        <option value="2">Option 2</option>
                        <option value="3">Option 3</option>
                        <option value="4">Option 4</option>
                    </select>
                </div>

                <button class="publish-btn" id="saveQuestionBtn" style="margin: 0; width: 100%; padding: 10px; font-size: 13px; background: #0284c7;">Add Question</button>
            </div>

            <!-- Existing Questions List -->
            <div id="questionsListContainer" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Loaded dynamically -->
            </div>
        </div>

    </div>
</div>

<script src="js/api.js?v=1.1"></script>
<script src="js/tutor-module-details.js?v=1.1"></script>
</body>
</html>
