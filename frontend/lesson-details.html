<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <div class="top-header">
            <div>
                <h1>Lesson Details</h1>
                <p>Preview lesson content and video.</p>
            </div>
        </div>

        <div class="lesson-container">

            <h2 id="lessonTitle">Loading...</h2>
            <div id="progressSection" style="margin:15px 0;">
    <div id="progressText">Progress: 0%</div>

    <div style="
        width:100%;
        height:12px;
        background:#e5e7eb;
        border-radius:999px;
        overflow:hidden;
        margin-top:8px;
    ">
        <div
            id="progressBar"
            style="
                width:0%;
                height:100%;
                background:#2563eb;
                transition:width 0.3s ease;
            "
        ></div>
    </div>

    <div
        id="completionBadge"
        style="
            display:none;
            margin-top:10px;
            color:green;
            font-weight:bold;
        "
    >
        ✓ Completed
    </div>
</div>
            <div id="lessonContent" class="lesson-content">
                Loading lesson content...
            </div>

            <div class="lesson-actions">
                <button class="action-btn" onclick="history.back()">
                    Back to Course
                </button>
            </div>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/lesson-details.js"></script>

</body>
</html>
