<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo-container" style="padding: 10px 0 25px 0; display: flex; justify-content: flex-start; align-items: center;">
            <img src="assets/logo.svg" alt="High Court LMS Logo" style="height: 75px; width: auto; max-width: 220px; object-fit: contain; display: block;">
        </div>
    <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="users.html">Users</a></li>
        <li><a href="admin-courses.html">Courses</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="admin-certificates.html">Certificates</a></li>
        <li><a href="admin-settings.html" class="active">Settings</a></li>
        <li><a href="admin-profile.html">Profile</a></li>
        
    </ul>

        <div class="sidebar-logout">
            <a href="index.html" onclick="localStorage.clear()">Logout</a>
        </div>
</div>

<div class="main">

    <div class="top-header">
        <div>
            <h1>Admin Settings</h1>
            <p>Manage LMS configuration and platform preferences</p>
        </div>
    </div>

    <div class="profile-details">

        <h2>Platform Settings</h2>

        <div class="form-group">
            <label>LMS Name</label>
            <input type="text" id="lmsName" value="High Court of Kerala LMS">
        </div>

        <div class="form-group">
    <label>Session Timeout</label>
    <select id="sessionTimeout">
        <option value="30 minutes">30 minutes</option>
        <option value="1 hour">1 hour</option>
        <option value="2 hours">2 hours</option>
    </select>
</div>

       <div class="form-group">
    <label>Default User Role</label>
   <input
    type="text"
    id="defaultRole"
    value="Learner"
    readonly
>
</div>

        <h2>Certificate Settings</h2>

        <div class="form-group">
            <label>Certificate Prefix</label>
            <input type="text" id="certificatePrefix" value="HCK-LMS">
        </div>

        <div class="form-group">
            <label>Certificate Format</label>
            <input type="text" value="HCK-LMS-YYYY-XXXXX" readonly>
        </div>

        <h2>Storage Settings</h2>

        <div class="form-group">
            <label>Video Storage</label>
            <input type="text" value="MinIO / S3 Compatible Storage" readonly>
        </div>

        <div class="form-group">
            <label>Allowed Video Type</label>
            <input type="text" value="MP4" readonly>
        </div>

        <h2>Category Management</h2>
        
        <div class="form-group" style="display: flex; gap: 12px; margin-bottom: 15px; align-items: flex-end;">
            <div style="flex: 1;">
                <label>Add New Category</label>
                <input type="text" id="newCategoryName" placeholder="Enter new category name" style="width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size:14px; margin-bottom: 0;">
            </div>
            <button class="publish-btn" id="addCategoryBtn" style="margin: 0; padding: 12px 20px; font-size: 14px; white-space: nowrap;">Add Category</button>
        </div>

        <div class="form-group">
            <label style="margin-bottom: 8px; display: block;">Platform Categories</label>
            <div id="adminCategoryList" style="display: flex; flex-wrap: wrap; gap: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; min-height: 50px;">
                <!-- Categories loaded dynamically here -->
            </div>
        </div>

        <button class="publish-btn" id="saveSettingsBtn" style="margin-top: 20px;">
            Save Settings
        </button>

        <p id="settingsMessage"></p>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/admin-settings.js"></script>

</body>
</html>
