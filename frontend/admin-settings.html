<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>HCK LMS</h2>
    <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="users.html">Users</a></li>
        <li><a href="admin-courses.html">Courses</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="admin-certificates.html">Certificates</a></li>
        <li><a href="admin-settings.html" class="active">Settings</a></li>
        <li><a href="admin-profile.html">Profile</a></li>
        <li><a href="index.html">Logout</a></li>
    </ul>
</div>

<div class="main">

    <div class="top-header">
        <div>
            <h1>Admin Settings</h1>
            <p>Manage LMS configuration and platform preferences</p>
        </div>
    </div>

    <div class="profile-details">

        <h2>Platform Settings</h2>

        <div class="form-group">
            <label>LMS Name</label>
            <input type="text" id="lmsName" value="High Court of Kerala LMS">
        </div>

        <div class="form-group">
    <label>Session Timeout</label>
    <select id="sessionTimeout">
        <option value="30 minutes">30 minutes</option>
        <option value="1 hour">1 hour</option>
        <option value="2 hours">2 hours</option>
    </select>
</div>

       <div class="form-group">
    <label>Default User Role</label>
   <input
    type="text"
    id="defaultRole"
    value="Learner"
    readonly
>
</div>

        <h2>Certificate Settings</h2>

        <div class="form-group">
            <label>Certificate Prefix</label>
            <input type="text" id="certificatePrefix" value="HCK-LMS">
        </div>

        <div class="form-group">
            <label>Certificate Format</label>
            <input type="text" value="HCK-LMS-YYYY-XXXXX" readonly>
        </div>

        <h2>Storage Settings</h2>

        <div class="form-group">
            <label>Video Storage</label>
            <input type="text" value="MinIO / S3 Compatible Storage" readonly>
        </div>

        <div class="form-group">
            <label>Allowed Video Type</label>
            <input type="text" value="MP4" readonly>
        </div>

        <button class="publish-btn" id="saveSettingsBtn">
            Save Settings
        </button>

        <p id="settingsMessage"></p>

    </div>

</div>

<script src="js/admin-settings.js"></script>

</body>
</html>
