                <label>LMS Name</label>
                <input type="text" value="HCK LMS">

                <label>Organization</label>
                <input type="text" value="High Court of Kerala">
            </div>

            <div class="form-group">
                <label>Default User Role</label>
                <select>
                    <option>Learner</option>
                    <option>Tutor</option>

                </select>
            </div>

            <button class="publish-btn">Save Settings</button>
        </div>
