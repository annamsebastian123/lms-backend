<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <h2>HCK LMS</h2>

    <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="users.html" class="active">Users</a></li>
        <li><a href="admin-courses.html">Courses</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="admin-certificates.html">Certificates</a></li>
        <li><a href="admin-settings.html">Settings</a></li>
        <li><a href="admin-profile.html">Profile</a></li>
        <li><a href="index.html">Logout</a></li>
    </ul>
</div>

<div class="main">

    <div class="top-header">
        <div>
            <h1>Add New User</h1>
            <p>Create learner, tutor, or admin account</p>
        </div>
    </div>

    <div class="profile-details">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="form-group">
            <label>Role</label>
            <select id="role">
                <option value="LEARNER">Learner</option>
                <option value="TUTOR">Tutor</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button class="publish-btn" id="createUserBtn">
            Create User
        </button>

        <a href="users.html">
            <button class="action-btn" style="margin-top: 10px;">
                Back to Users
            </button>
        </a>

        <p id="message"></p>

    </div>

</div>

<script src="js/add-user.js"></script>

</body>
</html>
