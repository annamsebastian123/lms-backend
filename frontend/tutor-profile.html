<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2>HCK LMS</h2>

    <ul>

        <li>
            <a href="tutor-dashboard.html">
                Dashboard
            </a>
        </li>

        <li>
            <a href="my-courses.html">
                My Courses
            </a>
        </li>

        <li>
            <a href="create-course.html">
                Create Course
            </a>
        </li>

        <li>
            <a href="analytics.html">
                Analytics
            </a>
        </li>

        <li>
            <a href="tutor-profile.html" class="active">
                Profile
            </a>
        </li>

        <li>
            <a href="index.html">
                Logout
            </a>
        </li>

    </ul>

</div>

<div class="main">
    <h1>Tutor Profile</h1>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar">T</div>
            <h2 id="profileName">Loading...</h2>
            <p id="profileRole">TUTOR</p>
        </div>

        <div class="profile-details">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" id="department" value="High Court of Kerala" readonly>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="Phone number">
            </div>

            <button type="button" class="publish-btn" id="updateProfileBtn">
                Update Profile
            </button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/tutor-profile.js"></script>
</body>
</html>
