<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2>HCK LMS</h2>

    <ul>

        <li>
            <a href="tutor-dashboard.html">

        <li>

            <a href="tutor-profile.html" class="active">
                Profile

        <li>
            <a href="index.html">
                Logout
            </a>
        </li>

    </ul>

</div>

<div class="main">
    <h1>Tutor Profile</h1>

    <div class="profile-container">
        <div class="profile-card">
           
<div class="profile-image-wrapper">

    <div class="profile-avatar" id="profileAvatar">T</div>

    <img id="profileImage" class="profile-image" alt="Profile Photo" style="display:none;">

    <label for="profileImageInput" class="edit-photo-btn">
        <i class="fas fa-pen"></i>
    </label>

    <input type="file" id="profileImageInput" accept="image/*" hidden>

</div>
            <h2 id="profileName">Loading...</h2>
            <p id="profileRole">TUTOR</p>
        </div>

        <div class="profile-details">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>

           <div class="form-group">
    <label>Section</label>
    <input type="text" id="section">
</div>

<div class="form-group">
    <label>Phone Number</label>
    <input type="text" id="phone">
</div>

<div class="form-group">
    <label>Designation</label>
    <input type="text" id="designation">
</div>



            <button type="button" class="publish-btn" id="updateProfileBtn">
                Update Profile
            </button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/tutor-profile.js"></script>
</body>
</html>
