<svg viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Noto Serif Malayalam', serif">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A63E"/>
      <stop offset="100%" stop-color="#A9761E"/>
    </linearGradient>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8C2432"/>
      <stop offset="100%" stop-color="#6B1622"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <g transform="translate(90,90)">
    <circle r="72" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle r="65" fill="url(#badgeGrad)"/>
    <circle r="65" fill="none" stroke="#3F0F16" stroke-width="1.5"/>

    <!-- laurel-style side ticks -->
    <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
      <path d="M -65 -10 L -72 -14 M -65 0 L -73 0 M -65 10 L -72 14" />
      <path d="M 65 -10 L 72 -14 M 65 0 L 73 0 M 65 10 L 72 14" />
    </g>

    <!-- inner ring -->
    <circle r="50" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>

    <!-- monogram -->
    <text x="0" y="4" font-size="30" text-anchor="middle" fill="#FDF6E3" font-weight="700" letter-spacing="1" font-family="'Trajan Pro','Cinzel',Georgia,serif">HCK</text>
    <text x="0" y="30" font-size="20" text-anchor="middle" fill="#D9A63E" font-weight="700" letter-spacing="3" font-family="'Trajan Pro','Cinzel',Georgia,serif">LMS</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(185,0)">
    <text x="0" y="52" font-size="21" fill="#fca5a5" font-weight="600">കേരള ഹൈക്കോടതി</text>

    <text x="0" y="92" font-size="36" fill="#ffffff" font-weight="700" letter-spacing="1" font-family="'Trajan Pro','Cinzel',Georgia,serif">HIGH COURT</text>
    <text x="260" y="92" font-size="36" fill="#D9A63E" font-weight="700" letter-spacing="2" font-family="'Trajan Pro','Cinzel',Georgia,serif">LMS</text>

    <text x="0" y="122" font-size="15" fill="#94a3b8" font-weight="500" letter-spacing="2">LEARNING MANAGEMENT SYSTEM</text>

    <rect x="0" y="136" width="345" height="2.5" fill="url(#goldGrad)"/>
  </g>
</svg>
