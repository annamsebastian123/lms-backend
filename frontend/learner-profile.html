<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner Profile</title>
<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <div class="sidebar-logo-container" style="padding: 10px 0 25px 0; display: flex; justify-content: flex-start; align-items: center;">
            <img src="assets/logo.svg" alt="High Court LMS Logo" style="height: 75px; width: auto; max-width: 220px; object-fit: contain; display: block;">
        </div>

    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="learning.html">My Learning</a></li>
        <li><a href="certificates.html">Certificates</a></li>
        <li><a href="learner-profile.html" class="active">Profile</a></li>
        
    </ul>

        <div class="sidebar-logout">
            <a href="index.html" onclick="localStorage.clear()">Logout</a>
        </div>
</div>

<div class="main">

    <h1>Learner Profile</h1>

    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-image-wrapper">

    <div class="profile-avatar" id="profileAvatar">L</div>

    <img id="profileImage" class="profile-image" alt="Profile Photo">

    <label for="profileImageInput" class="edit-photo-btn">
        <i class="fas fa-pen"></i>
    </label>

    <input
        type="file"
        id="profileImageInput"
        accept="image/*"
        hidden
    >

</div>

            <h2 id="profileName">Loading...</h2>

            <p id="profileRole">LEARNER</p>

        </div>

        <div class="profile-details">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
    <label>Section</label>
    <input type="text" id="section">
</div>

<div class="form-group">
    <label>Phone Number</label>
    <input type="text" id="phone">
</div>

<div class="form-group">
    <label>Designation</label>

    <select id="designation">
        <option value="">Select Designation</option>
        <option value="ASSISTANT">Assistant</option>
        <option value="SECTION_OFFICER">Section Officer</option>
        <option value="ASSISTANT_REGISTRAR">Assistant Registrar</option>
        <option value="DEPUTY_REGISTRAR">Deputy Registrar</option>
    </select>
</div>


            <button class="publish-btn" id="updateProfileBtn">
                Update Profile
            </button>

        </div>

    </div>

</div>

<script src="js/learner-profile.js"></script>

</body>

</html>
