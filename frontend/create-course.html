    </div>

    <div class="main">

        <div class="form-container">

            <h1>Create New Course</h1>

            <div class="form-group">

                <label>Course Title</label>

                <input type="text" id="courseTitle"
                       placeholder="Enter Course Title">

            </div>

            <div class="form-group">

                <label>Category</label>

                <select>

                    <option>Select Category</option>
                    <option>Registry</option>
                    <option>Documentation</option>
                    <option>Legal Procedures</option>

                </select>

            </div>

            <div class="form-group">

                <label>Course Description</label>

                <textarea rows="6" id="courseDescription"
                          placeholder="Enter Course Description"></textarea>

            </div>

            <div class="form-group">

                <label>Course Thumbnail</label>

                <input type="file">

            </div>

            <div class="form-group">

                <label>Course Duration</label>

                <input type="text"
                       placeholder="e.g. 4 Hours">

            </div>

            <div class="form-group">

                <label>Number of Modules</label>

                <input type="number"
                       placeholder="Enter Number of Modules">

            </div>

            <div class="button-group">

                <button class="draft-btn" id="draftBtn">
                    Save Draft
                </button>

                <button class="publish-btn" id="publishBtn">
                    Submit for Review
                </button>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/create-course.js"></script>
