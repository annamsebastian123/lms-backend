<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">

        <div class="sidebar-logo-container" style="padding: 10px 0 25px 0; display: flex; justify-content: flex-start; align-items: center;">
            <img src="assets/logo.svg" alt="High Court LMS Logo" style="height: 75px; width: auto; max-width: 220px; object-fit: contain; display: block;">
        </div>

        <ul>
    <li>
        <a href="tutor-dashboard.html">
            Dashboard
        </a>
    </li>

    <li>
        <a href="my-courses.html">
            My Courses
        </a>
    </li>

    <li>
        <a href="create-course.html" class="active">
            Create Course
        </a>
    </li>

    <li>
        <a href="analytics.html">
            Analytics
        </a>
    </li>

    <li>
        <a href="tutor-profile.html">
            Profile
        </a>
    </li>

    
</ul>

        <div class="sidebar-logout">
            <a href="index.html" onclick="localStorage.clear()">Logout</a>
        </div>

    </div>

    <div class="main">

        <div class="form-container">

            <h1>Create New Course</h1>

            <div class="form-group">

                <label>Course Title</label>

                <input type="text" id="courseTitle"
                       placeholder="Enter Course Title">

            </div>

          <div class="form-group">

    <label>Category</label>

    <select id="courseCategory">
        <option value="Legal Procedures">Legal Procedures</option>
        <option value="Registry Operations">Registry Operations</option>
        <option value="Court Technology">Court Technology</option>
        <option value="Administration">Administration</option>
        <option value="General">General</option>
    </select>

</div>
<div class="form-group">
    <label>Publish For</label>

    <select id="targetRole">
        <option value="ALL">Everyone</option>
        <option value="ASSISTANT">Assistant</option>
        <option value="SECTION_OFFICER">Section Officer</option>
        <option value="ASSISTANT_REGISTRAR">Assistant Registrar</option>
        <option value="DEPUTY_REGISTRAR">Deputy Registrar</option>
    </select>
</div>
<div class="form-group">
    <label>Course Type</label>
    <select id="isContinuing">
        <option value="false">Full Course Upload (Locked upon publication)</option>
        <option value="true">Continuing Course (Can add chapters ongoingly)</option>
    </select>
</div>

            <div class="form-group">

                <label>Course Description</label>

                <textarea rows="6" id="courseDescription"
                          placeholder="Enter Course Description"></textarea>

            </div>

            <div class="form-group">

                <label>Course Thumbnail</label>

                <input
    type="file"
    id="courseThumbnail"
    accept="image/*">

            </div>

            

            <div class="button-group">

                <button class="draft-btn" id="draftBtn">
                    Save Draft
                </button>

                <button class="publish-btn" id="publishBtn">
                    Submit for Review
                </button>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/create-course.js"></script>
</body>

</html>
