<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">

        <h2>HCK LMS</h2>

        <ul>
            <li>Dashboard</li>
            <li>My Courses</li>
            <li>Create Course</li>
            <li>Analytics</li>
            <li>Profile</li>
            <li>Logout</li>
        </ul>

    </div>

    <div class="main">

        <div class="form-container">

            <h1>Create New Course</h1>

            <div class="form-group">

                <label>Course Title</label>

                <input type="text" id="courseTitle"
                       placeholder="Enter Course Title">

            </div>

            <div class="form-group">

                <label>Category</label>

                <select>

                    <option>Select Category</option>
                    <option>Registry</option>
                    <option>Documentation</option>
                    <option>Legal Procedures</option>

                </select>

            </div>

            <div class="form-group">

                <label>Course Description</label>

                <textarea rows="6" id="courseDescription"
                          placeholder="Enter Course Description"></textarea>

            </div>

            <div class="form-group">

                <label>Course Thumbnail</label>

                <input type="file">

            </div>

            <div class="form-group">

                <label>Course Duration</label>

                <input type="text"
                       placeholder="e.g. 4 Hours">

            </div>

            <div class="form-group">

                <label>Number of Modules</label>

                <input type="number"
                       placeholder="Enter Number of Modules">

            </div>

            <div class="button-group">

                <button class="draft-btn" id="draftBtn">
                    Save Draft
                </button>

                <button class="publish-btn" id="publishBtn">
                    Publish Course
                </button>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/create-course.js"></script>
</body>

</html>
