<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">

        <h2>HCK LMS</h2>

        <ul>
            <li>Dashboard</li>
            <li>Courses</li>
            <li>My Learning</li>
            <li>Certificates</li>
            <li>Profile</li>
            <li>Logout</li>
        </ul>

    </div>

    <div class="main">

        <div class="result-container">

            <div class="result-icon">
                ✓
            </div>

            <h1>Quiz Completed!</h1>

            <p class="result-message">
                Congratulations! You have successfully completed the assessment.
            </p>

            <div class="result-cards">

                <div class="result-card">
                    <h3>Score</h3>
                    <h2>8 / 10</h2>
                </div>

                <div class="result-card">
                    <h3>Percentage</h3>
                    <h2>80%</h2>
                </div>

                <div class="result-card">
                    <h3>Status</h3>
                    <h2>PASS</h2>
                </div>

            </div>

            <div class="result-actions">

                <button class="btn">
                    Retake Quiz
                </button>

                <button class="btn">
                    View Certificate
                </button>

            </div>

        </div>

    </div>

</body>

</html>
